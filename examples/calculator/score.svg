<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" data-codetta-version="0.1" viewBox="0 0 640 680" width="640" height="680" font-family="Segoe UI, Arial, sans-serif" color="#243c47">
  <defs>
    <g id="note-quarter">
      <ellipse cx="0" cy="0" rx="7" ry="4.5" transform="rotate(-20)" fill="currentColor" stroke="currentColor" stroke-width="2" />
      <line x1="6" x2="6" y1="-2" y2="-32" stroke="currentColor" stroke-width="2" />
    </g>
    <g id="note-half">
      <ellipse cx="0" cy="0" rx="7" ry="4.5" transform="rotate(-20)" fill="white" stroke="currentColor" stroke-width="2" />
      <line x1="6" x2="6" y1="-2" y2="-32" stroke="currentColor" stroke-width="2" />
    </g>
    <g id="note-dotted-half">
      <ellipse cx="0" cy="0" rx="7" ry="4.5" transform="rotate(-20)" fill="white" stroke="currentColor" stroke-width="2" />
      <line x1="6" x2="6" y1="-2" y2="-32" stroke="currentColor" stroke-width="2" />
      <circle cx="14" cy="-2" r="2.2" fill="currentColor" />
    </g>
    <g id="note-whole">
      <ellipse cx="0" cy="0" rx="7" ry="4.5" transform="rotate(-20)" fill="white" stroke="currentColor" stroke-width="2" />
    </g>
  </defs>
  <rect width="100%" height="100%" fill="#f5f2e9" />
  <text x="32" y="38" font-size="25" font-weight="bold" fill="#243c47">CODETTA</text>
  <text x="32" y="62" font-size="12" fill="#64747a">v0.1 / executable score / quarter note = 1</text>
  <g data-codetta="emit" transform="translate(32,82)">
    <rect x="0" y="0" width="532" height="528" rx="8" fill="#ffffff" stroke="#335f72" stroke-width="1.5" />
    <text x="12" y="22" font-size="12" fill="#335f72" font-weight="bold">OUTPUT / final cadence</text>
    <g data-codetta="scale" transform="translate(16,40)">
      <rect x="0" y="0" width="492" height="462" rx="8" fill="#ffffff" stroke="#335f72" stroke-width="1.5" />
      <text x="12" y="22" font-size="12" fill="#335f72" font-weight="bold">SCALE / multiply</text>
      <g data-codetta="voice" data-role="body">
        <text x="12" y="62" font-size="11" fill="#335f72">BODY</text>
        <g data-codetta="sequence" transform="translate(90,40)">
          <rect x="0" y="0" width="382" height="218" rx="8" fill="#ffffff" stroke="#335f72" stroke-width="1.5" />
          <text x="12" y="22" font-size="12" fill="#335f72" font-weight="bold">PHRASE / consecutive</text>
          <g data-codetta="span" transform="translate(16,40)">
            <rect x="0" y="0" width="150" height="160" rx="8" fill="#ffffff" stroke="#335f72" stroke-width="1.5" />
            <text x="12" y="22" font-size="12" fill="#335f72" font-weight="bold">VALUE</text>
            <line x1="10" x2="140" y1="102" y2="102" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="140" y1="92" y2="92" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="140" y1="82" y2="82" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="140" y1="72" y2="72" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="140" y1="62" y2="62" stroke="#d2dadd" stroke-width="1" />
            <text x="112" y="22" font-size="11" fill="#64747a">C4</text>
            <g data-codetta="note" data-pitch="60">
              <line x1="21" x2="43" y1="112" y2="112" stroke="#83969d" />
              <use href="#note-dotted-half" x="32" y="112" />
            </g>
            <text x="12" y="145" font-size="10" fill="#64747a">1 quarter note = 1 unit</text>
          </g>
          <text x="172" y="120" font-size="19" fill="#64747a">→</text>
          <g data-codetta="span" transform="translate(194,40)">
            <rect x="0" y="0" width="172" height="160" rx="8" fill="#ffffff" stroke="#335f72" stroke-width="1.5" />
            <text x="12" y="22" font-size="12" fill="#335f72" font-weight="bold">VALUE</text>
            <line x1="10" x2="162" y1="102" y2="102" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="162" y1="92" y2="92" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="162" y1="82" y2="82" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="162" y1="72" y2="72" stroke="#d2dadd" stroke-width="1" />
            <line x1="10" x2="162" y1="62" y2="62" stroke="#d2dadd" stroke-width="1" />
            <text x="134" y="22" font-size="11" fill="#64747a">C4</text>
            <g data-codetta="note" data-pitch="60">
              <line x1="21" x2="43" y1="112" y2="112" stroke="#83969d" />
              <use href="#note-whole" x="32" y="112" />
            </g>
            <path data-codetta="tie" d="M 38 124 Q 60 140 82 124" fill="none" stroke="#335f72" stroke-width="1.5" />
            <g data-codetta="note" data-pitch="60">
              <line x1="77" x2="99" y1="112" y2="112" stroke="#83969d" />
              <use href="#note-quarter" x="88" y="112" />
            </g>
            <text x="12" y="145" font-size="10" fill="#64747a">1 quarter note = 1 unit</text>
          </g>
        </g>
      </g>
      <g data-codetta="voice" data-role="control">
        <text x="12" y="304" font-size="11" fill="#335f72">CONTROL</text>
        <g data-codetta="span" transform="translate(90,282)">
          <rect x="0" y="0" width="150" height="160" rx="8" fill="#ffffff" stroke="#335f72" stroke-width="1.5" />
          <text x="12" y="22" font-size="12" fill="#335f72" font-weight="bold">VALUE</text>
          <line x1="10" x2="140" y1="102" y2="102" stroke="#d2dadd" stroke-width="1" />
          <line x1="10" x2="140" y1="92" y2="92" stroke="#d2dadd" stroke-width="1" />
          <line x1="10" x2="140" y1="82" y2="82" stroke="#d2dadd" stroke-width="1" />
          <line x1="10" x2="140" y1="72" y2="72" stroke="#d2dadd" stroke-width="1" />
          <line x1="10" x2="140" y1="62" y2="62" stroke="#d2dadd" stroke-width="1" />
          <text x="112" y="22" font-size="11" fill="#64747a">C4</text>
          <g data-codetta="note" data-pitch="60">
            <line x1="21" x2="43" y1="112" y2="112" stroke="#83969d" />
            <use href="#note-half" x="32" y="112" />
          </g>
          <text x="12" y="145" font-size="10" fill="#64747a">1 quarter note = 1 unit</text>
        </g>
      </g>
    </g>
    <line x1="520" x2="520" y1="40" y2="514" stroke="#335f72" stroke-width="1.5" />
    <line x1="526" x2="526" y1="40" y2="514" stroke="#335f72" stroke-width="4" />
  </g>
  <text x="32" y="644" font-size="11" fill="#64747a">Read left to right. Control voices play first; their value stretches the body.</text>
</svg>